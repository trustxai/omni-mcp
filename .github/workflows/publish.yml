name: Publish to PyPI (manual)

# Manual fallback only: the normal path is the `publish` job in
# release-please.yml, which runs automatically when a release is created.
#
# PyPI binds a trusted publisher to a workflow *filename* plus environment, so
# this file needs its own publisher entry (workflow `publish.yml`, environment
# `pypi`) next to the `release-please.yml` one, or `uv publish` below fails to
# exchange the OIDC token. See CONTRIBUTING.md → Commits and releases.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      # Trusted publishing (OIDC) — no API token secret.
      - run: uv publish
