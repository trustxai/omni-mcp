name: Release Please

on:
  push:
    branches: [ main ]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    # Publishing lives here rather than in a `release: published` workflow:
    # release-please creates the Release with GITHUB_TOKEN, and GitHub does not
    # trigger workflows from GITHUB_TOKEN-generated events.
    # Needs a PyPI trusted publisher registered for workflow `release-please.yml`
    # + environment `pypi` (publish.yml needs a second, separate entry).
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      # Trusted publishing (OIDC) — no API token secret.
      - run: uv publish
